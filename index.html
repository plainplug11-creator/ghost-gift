<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04050d" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <title>Ghost Gift</title>
    <link rel="preconnect" href="https://telegram.org" />
    <!-- Official Telegram Mini Apps SDK (must load before the app) -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <link rel="preload" as="image" href="%BASE_URL%media/bg-poster.webp" fetchpriority="high" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>
  <body>
    <!-- Background: poster paints first; ambience/background.ts upgrades to the looping video -->
    <!-- shared gradient for jelly SVG glyphs -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
      <filter id="mb" x="-15%" y="0" width="130%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="10 0"/></filter>
              <linearGradient id="jg-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#e6e0ff"/><stop offset="1" stop-color="#b9adff"/></linearGradient>
    </defs></svg>
    <div class="bg" id="bg" aria-hidden="true">
      <img class="bg-media bg-poster" src="%BASE_URL%media/bg-poster.webp" alt="" fetchpriority="high" decoding="async" onload="this.classList.add('is-ready')" />
      <div class="bg-scrim"></div>
    </div>
    <canvas id="ambience" aria-hidden="true"></canvas>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
